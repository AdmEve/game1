<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16233a" />
    <title>راه‌بندون</title>
  </head>
  <body>
    <div id="splash"><div class="logo">راه‌بندون</div><div class="dots"><i></i><i></i><i></i></div></div>
    <style>
      /* Shown from the very first paint: its animation runs on the compositor, so it keeps moving while the game builds its world. */
      #splash { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: linear-gradient(#16233a, #2b4a6f); color: #fff; font: 900 44px Vazirmatn, system-ui, sans-serif; transition: opacity .45s; }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .dots { display: flex; gap: 12px; }
      #splash .dots i { width: 14px; height: 14px; border-radius: 50%; background: #ffc928; animation: sp 1s ease-in-out infinite; }
      #splash .dots i:nth-child(2) { animation-delay: .15s; } #splash .dots i:nth-child(3) { animation-delay: .3s; }
      @keyframes sp { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-14px); opacity: 1; } }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
