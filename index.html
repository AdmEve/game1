<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16233a" />
    <title>راه‌بندون</title>
  </head>
  <body>
    <link rel="preload" as="image" href="/hero-taxi.webp" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Vazirmatn-Black.woff2" crossorigin />
    <div id="splash">
      <div class="glow"></div>
      <img class="hero" src="/hero-taxi.webp" alt="" />
      <div class="logo">راه‌بندون<small>TEHRAN · GRIDLOCK</small></div>
      <div class="bar"><i></i></div>
      <div class="tip">ترافیک تهران، تو دستای تو</div>
    </div>
    <style>
      /* Shown from the very first paint, laid out like the Android launch splash (scripts/make-icons.mjs draws that
         from this same layout), so the handover from the system splash is seamless. Everything that moves here is
         transform/opacity only: it keeps moving on the compositor while the game builds its world. */
      /* The logo's weight is preloaded here, so the very first paint already shows it (no font swap). */
      @font-face { font-family: VazirSplash; src: url('/fonts/Vazirmatn-Black.woff2') format('woff2'); font-weight: 900; font-display: block; }
      #splash { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 99; color: #fff; font-family: VazirSplash, Vazirmatn, system-ui, sans-serif; overflow: hidden;
        background: radial-gradient(120% 80% at 50% 40%, #1d3354 0%, #101c30 55%, #0a1220 100%);
        transition: opacity .6s cubic-bezier(.4, 0, .2, 1), transform .6s cubic-bezier(.4, 0, .2, 1); }
      #splash.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .glow { position: absolute; width: 140vmax; height: 140vmax; left: 50%; top: 38%; margin: -70vmax 0 0 -70vmax; border-radius: 50%;
        background: radial-gradient(circle, rgba(242,177,36,.14), transparent 55%); animation: sglow 3.2s ease-in-out infinite alternate; will-change: transform, opacity; }
      @keyframes sglow { from { transform: scale(.85); opacity: .6; } to { transform: scale(1.05); opacity: 1; } }
      #splash .hero { position: absolute; left: 50%; top: 36%; width: min(76vw, 44vh); transform: translate(-50%, -50%);
        filter: drop-shadow(0 18px 22px rgba(0,0,0,.45)); animation: shero 2.8s ease-in-out infinite alternate; will-change: transform; }
      @keyframes shero { from { transform: translate(-50%, -50%); } to { transform: translate(-50%, calc(-50% - 1.2vh)); } }
      #splash .logo { position: absolute; left: 0; right: 0; top: 58%; font-weight: 900; font-size: min(13vw, 7.4vh); line-height: 1.1; text-align: center;
        letter-spacing: -.5px; text-shadow: 0 6px 24px rgba(0,0,0,.45); }
      #splash .logo small { display: block; font: 700 min(3.1vw, 1.8vh)/1.6 system-ui, sans-serif; letter-spacing: .5em; color: #f2b124; opacity: .9; margin-top: .6vh; }
      #splash .bar { position: absolute; left: 50%; top: 74%; width: 44vw; max-width: 200px; height: 4px; transform: translateX(-50%); border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
      #splash .bar i { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(90deg, #f2b124, #ffd36b); border-radius: 4px;
        transform-origin: right center; transform: scaleX(.04); transition: transform .35s cubic-bezier(.2,.8,.2,1); will-change: transform; }
      #splash .tip { position: absolute; left: 0; right: 0; top: 79%; text-align: center; font-size: min(3.6vw, 2.1vh); font-weight: 500; opacity: .6; }
      #splash.native .bar, #splash.native .glow { display: none; }
      #splash.native .hero { animation: none; }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
