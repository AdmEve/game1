<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16233a" />
    <title>راه‌بندون</title>
  </head>
  <body>
    <div id="splash">
      <div class="glow"></div>
      <div class="logo">راه‌بندون<small>TEHRAN · GRIDLOCK</small></div>
      <div class="bar"><i></i></div>
      <div class="tip">ترافیک تهران، تو دستای تو</div>
    </div>
    <style>
      /* Shown from the very first paint. Everything that moves here is transform/opacity only, so it keeps moving on
         the compositor even while the game builds its world on the main thread. */
      #splash { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
        background: radial-gradient(120% 80% at 50% 40%, #1d3354 0%, #101c30 55%, #0a1220 100%); color: #fff; font-family: Vazirmatn, system-ui, sans-serif;
        transition: opacity .6s cubic-bezier(.4, 0, .2, 1), transform .6s cubic-bezier(.4, 0, .2, 1); }
      #splash.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .glow { position: absolute; width: 140vw; height: 140vw; left: -20vw; top: 10vh; border-radius: 50%;
        background: radial-gradient(circle, rgba(242,177,36,.16), transparent 60%); animation: sglow 3.2s ease-in-out infinite alternate; will-change: transform, opacity; }
      @keyframes sglow { from { transform: scale(.85); opacity: .6; } to { transform: scale(1.05); opacity: 1; } }
      #splash .logo { position: relative; font-weight: 900; font-size: 52px; line-height: 1.1; text-align: center; letter-spacing: -.5px;
        text-shadow: 0 6px 24px rgba(0,0,0,.45); animation: slogo .9s cubic-bezier(.2,.9,.3,1) both; }
      #splash .logo small { display: block; font: 700 12px/1.6 system-ui, sans-serif; letter-spacing: 6px; color: #f2b124; opacity: .9; margin-top: 6px; }
      @keyframes slogo { from { transform: translateY(14px) scale(.96); opacity: 0; } }
      #splash .bar { position: relative; width: 168px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
      #splash .bar i { position: absolute; inset: 0; background: linear-gradient(90deg, #f2b124, #ffd36b); border-radius: 4px;
        transform-origin: right center; transform: scaleX(.04); transition: transform .35s cubic-bezier(.2,.8,.2,1); will-change: transform; }
      #splash .tip { position: relative; font-size: 14px; font-weight: 500; opacity: .6; animation: slogo 1.1s .2s cubic-bezier(.2,.9,.3,1) both; }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
