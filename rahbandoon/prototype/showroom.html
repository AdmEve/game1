<!doctype html>
<html><head><meta charset="utf-8">
<style>@font-face { font-family: V; src: url('vazir.woff2'); font-weight: 100 900; } html,body{margin:0;background:#000;overflow:hidden} canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { CARS, buildCar, buildZamyad, buildBus } from './cars.js';
import { outdoorEnv } from './env.js';
await document.fonts.load('900 40px V');
const q = new URLSearchParams(location.search);
const W = +(q.get('w') ?? 1600), H = +(q.get('h') ?? 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = outdoorEnv(renderer);
scene.environmentIntensity = 0.9;
scene.background = new THREE.Color(0xdfe5ea);
scene.fog = new THREE.Fog(0xdfe5ea, 22, 60);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0xc9cdd1, roughness: 0.75 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x8a8278, 0.6));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.6); sun.position.set(8, 14, 9); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 }); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4;
scene.add(sun);

const view = q.get('view') ?? 'lineup';
const add = (o, x, z, ry = 0) => { o.position.set(x, 0, z); o.rotation.y = ry; scene.add(o); return o; };
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);
if (view === 'lineup') {
  const r = -1.05;
  add(buildCar(CARS.peykan, 0x86bce0), -5.8, 1.6, r);
  add(buildCar(CARS.pride, 0xf3f3f1), -1.95, 1.6, r);
  add(buildCar(CARS.p405, 0x8e959c), 1.95, 1.6, r);
  add(buildCar(CARS.samand, 0xf5b800, { taxi: true }), 5.8, 1.6, r);
  add(buildZamyad(0x1f4f9a), -3.9, -3.6, r);
  add(buildBus(), 2.6, -4.6, r);
  camera.position.set(0, 6.5, 17); camera.lookAt(0, 0.6, -0.8);
} else {
  const name = view;
  const col = { peykan: 0x7fb4d9, pride: 0xf3f3f1, p405: 0x8e959c, samand: 0xf5b800 }[name];
  const car = name === 'zamyad' ? buildZamyad(0x1f4f9a) : name === 'bus' ? buildBus() : buildCar(CARS[name], col, { taxi: name === 'samand' });
  add(car, 0, 0, 0);
  const a = +(q.get('a') ?? 0.7), d = +(q.get('d') ?? 7.5), e = +(q.get('e') ?? 2.2);
  camera.position.set(Math.cos(a) * d, e, Math.sin(a) * d); camera.lookAt(0, 0.65, 0);
  camera.fov = 32; camera.updateProjectionMatrix();
}
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
if (q.get('ao') !== '0') { const ao = new GTAOPass(scene, camera, W, H); ao.blendIntensity = 0.9; ao.updateGtaoMaterial({ radius: 0.35, distanceExponent: 1.5, thickness: 1, scale: 1 }); composer.addPass(ao); }
composer.addPass(new OutputPass());
composer.addPass(new SMAAPass(W, H));
composer.render();
document.title = 'ready';
</script></body></html>
