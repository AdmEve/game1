<script type="module">

{ const g = sky.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#3d8fe0'); gr.addColorStop(.55, '#9fd3ff'); gr.addColorStop(1, '#ffe8c7'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256); }

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, ...o });

}

// Ground: grass everywhere, then pavement, road, lot.
add(new THREE.Mesh(new THREE.PlaneGeometry(220, 220), std(0x7cc35a, { map: noiseTex('#7cc35a', ['#5fa845', '#9bd66f'], 512, 40) })).rotateX(-Math.PI / 2), 0, -0.02, 0, false);

for (let i = 1; i < N; i++) {
  add(new THREE.Mesh(new THREE.PlaneGeometry(0.03, CELL * N), lineMat).rotateX(-Math.PI / 2), LX + i * CELL, 0.245, LZ + CELL * N / 2, false, false);
  add(new THREE.Mesh(new THREE.PlaneGeometry(CELL * N, 0.03), lineMat).rotateX(-Math.PI / 2), 0, 0.245, LZ + i * CELL, false, false);
}
// Road between the lot and the bays.
const roadZ = -1.6;
add(new THREE.Mesh(new THREE.BoxGeometry(40, 0.06, 1.7), std(0xffffff, { map: noiseTex('#3b424d', ['#2f353e', '#4b5361'], 512, 8), roughness: .95 })), 0, 0.03, roadZ, false);
for (let x = -18; x < 18; x += 1.4) add(new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.08), std(0xffd54a, { emissive: 0x332200 })).rotateX(-Math.PI / 2), x, 0.07, roadZ, false);

const bayZ = -3.35;

for (let x = -19; x < 20; x += 0.9) add(new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.01, 1.9), std(0xcdb991)), x, 0.185, -5.4, false, false);

const PAINT = { red: 0xc8141c, yellow: 0xf5b400, blue: 0x1857c9, green: 0x138a3f, purple: 0x6a2bc2, orange: 0xe85a0c, beige: 0xc9b98e };

  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const arrowShape = new THREE.Shape();
arrowShape.moveTo(0, 0.42); arrowShape.lineTo(0.3, 0.08); arrowShape.lineTo(0.12, 0.08); arrowShape.lineTo(0.12, -0.3); arrowShape.lineTo(-0.12, -0.3); arrowShape.lineTo(-0.12, 0.08); arrowShape.lineTo(-0.3, 0.08); arrowShape.closePath();

const arrowMat = std(0xffffff, { roughness: .5, emissive: 0x444444, transparent: true, opacity: .95 });

let modelIdx = 0;
function vehicle({ color, len = 2, type = 'car', model }) {
  const g = new THREE.Group();
  const L = len * CELL - 0.24;

  else if (type === 'van') { car = buildZamyad(PAINT[color]); specL = 4.97; specW = 1.68; roofX = -1.0; roofY = 1.3; car.position.x = 0.0; }
  else {

    const spec = CARS[m];

const ROT = { up: 0, down: Math.PI, left: Math.PI / 2, right: -Math.PI / 2 };

  const x = LX + (col + (horiz ? len : 1) / 2) * CELL, z = LZ + (row + (horiz ? 1 : len) / 2) * CELL;
  const v = vehicle({ color, len, type, model }); v.position.set(x, 0.24, z); v.rotation.y = ROT[dir]; scene.add(v); return v;
}
const cars = [
  [0, 0, 2, 'right', 'red'], [2, 0, 2, 'up', 'yellow', 'taxi'], [3, 0, 2, 'left', 'blue'], [5, 0, 2, 'down', 'green'], [6, 0, 2, 'up', 'purple'],
  [0, 1, 2, 'down', 'orange'], [3, 1, 2, 'right', 'red'],

  [2, 6, 2, 'right', 'purple'],

for (const c of cars) place(...c);
const peykan = place(4, 4, 2, 'right', 'beige', 'car', 'peykan');
// Smoke from the Peykan.
const smokeMat = new THREE.MeshStandardMaterial({ color: 0xd9dde3, transparent: true, opacity: .75, roughness: 1 });
[[0.9, 1.1, 0.24], [1.15, 1.55, 0.3], [1.45, 2.05, 0.36], [1.8, 2.6, 0.3]].forEach(([dx, y, r]) => add(new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), smokeMat), peykan.position.x + dx, y, peykan.position.z - 0.2, false, false));

  g.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });

queue.forEach((c, i) => { const p = person(c, i); p.position.set(3.05 - i * 0.52, 0.18, -5.15 + (i % 2) * 0.12); p.rotation.y = Math.PI * 0.5 + (Math.random() - .5) * .5; scene.add(p); });
// Two passengers walking to the taxi.
[[3.5, -4.2], [3.25, -3.75]].forEach(([x, z], i) => { const p = person('yellow', i + 7); p.position.set(x, 0.06, z); p.rotation.y = 0.3; scene.add(p); });

// Bus shelter.
const shelter = new THREE.Group();
const steel = std(0x6b7a90, { metalness: .6, roughness: .35 });
const roofS = rbox(2.4, 0.12, 1.1, 0.05, std(0x1e63d6, { roughness: .4 })); roofS.position.y = 1.75; shelter.add(roofS);

function tree(x, z, s = 1) {
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 0.9, 8), std(0x7a5232)); trunk.position.y = 0.45; t.add(trunk);
  const leaf = std(0x3fa34d, { roughness: .7 });
  [[0, 1.25, 0, .62], [0.3, 1.05, 0.15, .45], [-0.28, 1.1, -0.1, .48], [0, 1.6, 0, .42]].forEach(([a, b, c, r]) => { const s2 = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), leaf); s2.position.set(a, b, c); t.add(s2); });
  t.traverse((m) => { if (m.isMesh) m.castShadow = true; });
  t.scale.setScalar(s); t.position.set(x, 0, z); scene.add(t);
}

// ───── City backdrop ─────
function windowsTex(cols, rows, lit) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = lit; g.fillRect(0, 0, 128, 256);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) { g.fillStyle = Math.random() < .3 ? '#ffe9a8' : '#7fa7cf'; g.fillRect(8 + x * (112 / cols), 10 + y * (240 / rows), 112 / cols - 8, 240 / rows - 10); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const tones = ['#e8dccb', '#d9cbb6', '#cfd8e3', '#efe4d0', '#c9bfae'];
for (let i = 0; i < 26; i++) {
  const w = 1.6 + Math.random() * 1.8, h = 1.4 + Math.random() * 2.4, d = 1.6 + Math.random();
  const tex = windowsTex(3, Math.round(h * 1.6), tones[i % tones.length]);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), std(0xffffff, { map: tex }));
  add(m, -24 + i * 1.9 + Math.random() * .6, h / 2, -14 - Math.random() * 5);
}

const podGlass = new THREE.Mesh(new THREE.CylinderGeometry(1.48, 1.3, 0.5, 32), glass); podGlass.position.y = 13.7; milad.add(podGlass);

milad.traverse((m) => { if (m.isMesh) m.castShadow = true; });
milad.scale.setScalar(0.62); milad.position.set(5.2, 0, -30); scene.add(milad);

const az = new THREE.Shape();
az.moveTo(-2.2, 0); az.quadraticCurveTo(-1.2, 2.2, -0.7, 4.2); az.lineTo(0.7, 4.2); az.quadraticCurveTo(1.2, 2.2, 2.2, 0); az.lineTo(1.0, 0);
az.quadraticCurveTo(0.8, 2.0, 0, 2.6); az.quadraticCurveTo(-0.8, 2.0, -1.0, 0); az.closePath();
const azadi = new THREE.Mesh(new THREE.ExtrudeGeometry(az, { depth: 1.6, bevelEnabled: true, bevelSize: 0.08, bevelThickness: 0.08 }), std(0xf3ead6, { roughness: .6 }));
const azTop = rbox(1.7, 0.5, 1.9, 0.08, std(0xf3ead6)); azTop.position.set(0, 4.4, 0.8);
const azg = new THREE.Group(); azg.add(azadi, azTop); azg.traverse((m) => { if (m.isMesh) m.castShadow = true; });
azg.scale.setScalar(0.85); azg.position.set(-5.5, 0, -28); azg.rotation.y = 0.35; scene.add(azg);
// Alborz mountains.
const mtnMat = std(0x8aa3bf, { roughness: 1, flatShading: true });
const snow = std(0xffffff, { roughness: .9, flatShading: true });
for (const [x, h, r] of [[-30, 16, 14], [-12, 22, 16], [8, 19, 15], [26, 24, 17], [44, 15, 12]]) {

}

composer.addPass(new OutputPass());
composer.addPass(new SMAAPass(W * 3, H * 3));
composer.render();
