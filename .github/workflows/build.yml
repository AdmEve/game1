name: Build game

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test + build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # The production build must boot, win level 1 with real taps, go home with back and open the garage, with no
      # page errors, before an APK is published (scripts/smoke.cjs).
      - name: Smoke test (production build, headless browser)
        run: |
          npm i --no-save playwright@1.63.0 axe-core@4.10.3
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:4173/ && break; sleep 1; done
          URL=http://127.0.0.1:4173/ node scripts/smoke.cjs
          # Without WebGL, or failing while loading, it must say so on the splash with a retry (scripts/fatal.cjs).
          URL=http://127.0.0.1:4173/ node scripts/fatal.cjs
          # Older WebViews (Chrome 84+): no roundRect, CSS without :has()/inset, the update page (scripts/oldwebview.cjs).
          URL=http://127.0.0.1:4173/ node scripts/oldwebview.cjs
          # Hold to see the way out: real pointer events, quick taps never show it (scripts/holdpreview.cjs).
          URL=http://127.0.0.1:4173/ node scripts/holdpreview.cjs
          # Helps open one at a time on levels 6, 9 and 12, as a new player meets them (scripts/helpsopen.cjs).
          URL=http://127.0.0.1:4173/ node scripts/helpsopen.cjs
          # Past the ramp, hints come only when asked (scripts/hintoffer.cjs).
          URL=http://127.0.0.1:4173/ node scripts/hintoffer.cjs
          # Leaving a level in play costs what losing it costs, and asks first (scripts/quitcost.cjs).
          URL=http://127.0.0.1:4173/ node scripts/quitcost.cjs
          # The lose card's paid continue is offered only when one more bay can still win (scripts/fairgo.cjs).
          URL=http://127.0.0.1:4173/ node scripts/fairgo.cjs
          # Progress to another phone by code: refuses bad codes, asks first, keeps this phone's purchases (scripts/transfer.cjs).
          URL=http://127.0.0.1:4173/ node scripts/transfer.cjs
          # «امروز»: daily missions count wins, claims pay, the rush starts from the card (scripts/missions.cjs).
          URL=http://127.0.0.1:4173/ node scripts/missions.cjs
          # A hopeless loss offers going back to before the losing tap, replayed exactly (scripts/rewind.cjs).
          URL=http://127.0.0.1:4173/ node scripts/rewind.cjs
          # Characters' lines write themselves in, in their voices; tap, voices off, reduced motion, the veil (scripts/talk.cjs).
          URL=http://127.0.0.1:4173/ node scripts/talk.cjs
          # After the 240 levels, Endless Tehran: Play goes on to 241, wins pay, no lives (scripts/endless.cjs).
          URL=http://127.0.0.1:4173/ node scripts/endless.cjs
          # Screen-reader names and structure on the main screens (axe-core, WCAG 2 A/AA: scripts/a11y.cjs).
          URL=http://127.0.0.1:4173/ node scripts/a11y.cjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure
          path: smoke-fail.png
          if-no-files-found: ignore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/zendegi.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"
          else
            # No release key configured: sign with a throwaway key so the APK still installs for testing.
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore android/app/zendegi.keystore -alias zendegi -keyalg RSA -keysize 2048 \
              -validity 3650 -storepass "$PW" -keypass "$PW" -dname "CN=Test build" >/dev/null
            echo "::add-mask::$PW"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=temporary test key (NOT for store upload)" >> "$GITHUB_ENV"
          fi

      # One APK per store (BEST_IN_MARKET_PLAN N12): Cafe Bazaar's from the web build tested above, then the web part
      # rebuilt for Myket (its name, links and billing) and Myket's APK.
      - name: Build Android APKs (Cafe Bazaar, Myket)
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if grep -qi 'myket\|mservices' dist/assets/*.js; then echo "The Bazaar build names Myket"; exit 1; fi
          npx cap sync android
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon assembleBazaarRelease)
          cp android/app/build/outputs/apk/bazaar/release/app-bazaar-release.apk Rahbandoon.apk
          VITE_STORE=myket npm run build
          if grep -q 'cafebazaar\|کافه‌بازار' dist/assets/*.js; then echo "The Myket build names Cafe Bazaar"; exit 1; fi
          npx cap copy android
          (cd android && ./gradlew --no-daemon assembleMyketRelease)
          cp android/app/build/outputs/apk/myket/release/app-myket-release.apk Rahbandoon-myket.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rahbandoon-android-apk
          path: |
            Rahbandoon.apk
            Rahbandoon-myket.apk

      - name: Publish "latest" release (download link for your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Rahbandoon.apk Rahbandoon-myket.apk \
            --target "$GITHUB_SHA" \
            --title "Rahbandoon – latest build (${GITHUB_REF_NAME}, #${{ github.run_number }})" \
            --notes "Install on Android: open this page on your phone, tap **Rahbandoon.apk**, then allow installing from this source.

          Rahbandoon.apk is the Cafe Bazaar build; Rahbandoon-myket.apk is the same game for Myket (its own billing and links).

          Signed with: ${SIGNED_WITH}.

          Built from commit ${GITHUB_SHA::7}."
